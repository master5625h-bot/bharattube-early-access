<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>BharatTube Early Access - Admin</title><link rel="stylesheet" href="style.css"></head><body><div class="wrap">
<h1>Admin</h1>
<div class="card" id="lg"><label for="p">Admin password</label><input id="p" type="password"><button id="go">Dekhiye</button><div class="msg" id="m"></div></div>
<div class="card hide" id="dash"><div>Total registrations</div><div class="stat" id="c">0</div>
<button id="dl">CSV download karein</button><table id="t"><thead><tr><th>#</th><th>Naam</th><th>Email</th><th>Samay</th></tr></thead><tbody></tbody></table></div>
</div><script src="config.js"></script><script>
const C=window.BT_CONFIG,$=i=>document.getElementById(i);let rows=[];
$('go').onclick=async()=>{$('m').textContent='';
 const r=await fetch(C.SUPABASE_URL+'/rest/v1/rpc/admin_list',{method:'POST',headers:{apikey:C.SUPABASE_ANON_KEY,Authorization:'Bearer '+C.SUPABASE_ANON_KEY,'Content-Type':'application/json'},body:JSON.stringify({p_pass:$('p').value})});
 if(!r.ok){$('m').textContent='Password galat hai.';return}
 rows=await r.json();$('lg').classList.add('hide');$('dash').classList.remove('hide');$('c').textContent=rows.length;
 const tb=$('t').tBodies[0];rows.forEach(x=>{const tr=tb.insertRow();[x.id,x.name,x.email,new Date(x.created_at).toLocaleString('en-IN')].forEach(v=>tr.insertCell().textContent=v)})};
$('dl').onclick=()=>{const q=s=>'"'+String(s).replace(/"/g,'""').replace(/^([=+\-@])/,"'$1")+'"';
 const csv='id,name,email,created_at\n'+rows.map(x=>[x.id,x.name,x.email,x.created_at].map(q).join(',')).join('\n');
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='early-access.csv';a.click()};
</script></body></html>
